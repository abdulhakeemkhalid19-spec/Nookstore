<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NookStore | Your Style, Your Way</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            color: #171717;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .cart-button {
            background: white;
            color: black;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .hero {
            background: #222;
            color: white;
            padding: 65px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #ddd;
            margin-bottom: 25px;
        }

        .shop-button {
            display: inline-block;
            background: white;
            color: black;
            padding: 13px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .section {
            padding: 35px 18px;
        }

        .section h2 {
            margin-bottom: 25px;
            text-align: center;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: auto;
        }

        .product {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px #00000010;
        }

        .product img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background: #eee;
        }

        .product-info {
            padding: 12px;
        }

        .product h3 {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .price {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .add-button {
            width: 100%;
            background: #111;
            color: white;
            padding: 11px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-button:hover {
            background: #333;
        }

        #cart {
            background: white;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            display: none;
        }

        #cart h2 {
            margin-bottom: 15px;
        }

        .checkout-button {
            background: #087443;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
        }

        footer {
            background: #111;
            color: white;
            padding: 25px;
            text-align: center;
            margin-top: 30px;
        }

        @media (min-width: 700px) {
            .products {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .hero h1 {
                font-size: 48px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">NookStore.</div>

        <button class="cart-button" onclick="toggleCart()">
            Cart (<span id="cart-count">0</span>)
        </button>
    </header>

    <section class="hero">
        <h1>Your Style, Your Way.</h1>

        <p>Discover your next favourite fit at NookStore.</p>

        <a href="#shop" class="shop-button">Shop Now</a>
    </section>

    <section class="section" id="shop">
        <h2>Our Collection</h2>

        <div class="products" id="products"></div>
    </section>

    <section id="cart">
        <h2>Your Shopping Cart</h2>

        <div id="cart-items"></div>

        <h3 id="total">Total: ₦0</h3>

        <button class="checkout-button" onclick="checkout()">
            Order via WhatsApp
        </button>
    </section>

    <footer>
        <p>© 2026 NookStore. All rights reserved.</p>
        <p style="margin-top: 8px;">Your style. Your choice.</p>
    </footer>

    <script>
        const products = [
            {
                id: 1,
                name: "Oversized T-Shirt",
                price: 12000,
                image: "https://placehold.co/400x400?text=T-Shirt"
            },
            {
                id: 2,
                name: "Classic Hoodie",
                price: 20000,
                image: "https://placehold.co/400x400?text=Hoodie"
            },
            {
                id: 3,
                name: "Baggy Trousers",
                price: 18000,
                image: "https://placehold.co/400x400?text=Baggy"
            },
            {
                id: 4,
                name: "Casual Slides",
                price: 8000,
                image: "https://placehold.co/400x400?text=Slides"
            }
        ];

        let cart = [];

        function displayProducts() {
            const container = document.getElementById("products");

            container.innerHTML = products.map(product => `
                <div class="product">
                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    <div class="product-info">
                        <h3>${product.name}</h3>

                        <p class="price">
                            ₦${product.price.toLocaleString("en-NG")}
                        </p>

                        <button
                            class="add-button"
                            onclick="addToCart(${product.id})"
                        >
                            Add to Cart
                        </button>
                    </div>
                </div>
            `).join("");
        }

        function addToCart(id) {
            const product = products.find(item => item.id === id);

            cart.push(product);

            document.getElementById("cart-count").textContent =
                cart.length;

            alert(product.name + " added to cart!");

            updateCart();
        }

        function updateCart() {
            const container = document.getElementById("cart-items");

            container.innerHTML = cart.map((item, index) => `
                <p style="margin-bottom: 12px;">
                    ${item.name} — ₦${item.price.toLocaleString("en-NG")}

                    <button onclick="removeItem(${index})">
                        Remove
                    </button>
                </p>
            `).join("");

            const total = cart.reduce(
                (sum, item) => sum + item.price, 0
            );

            document.getElementById("total").textContent =
                "Total: ₦" + total.toLocaleString("en-NG");
        }

        function removeItem(index) {
            cart.splice(index, 1);

            document.getElementById("cart-count").textContent =
                cart.length;

            updateCart();
        }

        function toggleCart() {
            const cartSection = document.getElementById("cart");

            cartSection.style.display =
                cartSection.style.display === "block"
                    ? "none"
                    : "block";
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            const phone = prompt(
                "Enter your WhatsApp number, including country code:"
            );

            if (!phone) {
                return;
            }

            const validPhone = phone.replace(/\D/g, "");

            if (validPhone.length < 10) {
                alert("Please enter a valid phone number.");
                return;
            }

            const order = cart.map(item =>
                item.name + " - ₦" +
                item.price.toLocaleString("en-NG")
            ).join("\n");

            const total = cart.reduce(
                (sum, item) => sum + item.price, 0
            );

            const message =
                "Hello NookStore! I want to place an order:\n\n" +
                order +
                "\n\nTotal: ₦" +
                total.toLocaleString("en-NG") +
                "\nMy WhatsApp number: " + phone;

            const storeNumber = "2348000000000";

            window.open(
                "https://wa.me/" + storeNumber +
                "?text=" + encodeURIComponent(message),
                "_blank"
            );
        }

        displayProducts();
    </script>

</body>
</html>
