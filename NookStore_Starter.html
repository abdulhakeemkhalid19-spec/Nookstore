<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070b"><meta name="description" content="NookStore marketplace for independent sellers">
<title>NookStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08070b;--panel:#111015;--panel2:#15131a;--line:#25222d;--text:#f7f5fa;--muted:#9993a5;--purple:#4c1d95;--purple2:#6d35c4;--mint:#b7f7d4;--ink:#10271d;--radius:19px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px "DM Sans",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.app{min-height:100vh;padding-bottom:90px}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:#08070bed;backdrop-filter:blur(15px);border-bottom:1px solid #ffffff0b}.brand{display:flex;gap:11px;align-items:center}.logo{height:46px;width:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(140deg,#8758df,var(--purple));font:800 21px Manrope}.eyebrow{font-size:11px;color:var(--muted)}.brandname{font:800 21px Manrope}.icons{display:flex;gap:8px}.iconbtn{width:43px;height:43px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:white;font-size:19px}.content{max-width:1080px;margin:auto;padding:22px 18px 35px}.title{font:800 27px Manrope;letter-spacing:-.7px;margin:0 0 5px}.sub{color:var(--muted);line-height:1.5;margin:0 0 20px}.label{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;color:#a9a2b5;margin:26px 0 12px}.card,.stat,.form{background:linear-gradient(145deg,#121015,#0e0d11);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}.storelink{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:17px;background:#121016;margin-bottom:18px}.storeico,.stat-ico,.rowico{width:42px;height:42px;border-radius:13px;background:#25183b;color:var(--mint);display:grid;place-items:center;font-size:19px;flex-shrink:0}.storemeta{flex:1;min-width:0}.storemeta strong,.storemeta span{display:block;overflow-wrap:anywhere}.storemeta span{color:var(--muted);font-size:12px;margin-top:4px}.pill{background:#123323;color:var(--mint);padding:7px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat-ico{margin-bottom:14px}.value{font:800 24px Manrope}.muted{color:var(--muted)}.statlabel{color:var(--muted);font-size:12px;margin-top:4px}.ranges,.tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 14px}.chip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:10px 14px;border-radius:99px}.chip.active{background:var(--purple);border-color:#6d35c4;color:white}.banner{display:flex;align-items:center;gap:13px;padding:19px;border-radius:19px;background:linear-gradient(115deg,#291348,#4c1d95 60%,#183b30);margin:19px 0}.banner .spark{font-size:26px}.banner strong{font:800 18px Manrope}.banner p{margin:5px 0 0;color:#e2d8f2;line-height:1.4}.btn{border:0;border-radius:13px;padding:13px 16px;background:var(--purple);color:white;font-weight:800}.btn.mint{background:var(--mint);color:var(--ink)}.btn.secondary{background:var(--panel2);border:1px solid var(--line);box-shadow:none}.btn.full{width:100%}.headrow{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}.headrow h3{font:700 17px Manrope;margin:0}.textbtn{border:0;background:none;color:var(--mint);font-weight:700}.quickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick{display:flex;align-items:center;gap:11px;text-align:left;color:white;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.quick:first-child{background:linear-gradient(110deg,var(--purple),#602bb0)}.qico{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#ffffff12;font-size:18px}.empty{border:1px solid var(--line);border-radius:18px;padding:32px 14px;text-align:center;background:#0b0a0e;color:var(--muted);line-height:1.5}.empty .big{font-size:34px;margin-bottom:10px}.empty strong{display:block;color:white;margin-bottom:6px;font-size:15px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#09080df2;backdrop-filter:blur(18px);border-top:1px solid var(--line)}.nav button{border:0;background:none;color:#797283;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;padding:5px}.nav button span{font-size:20px}.nav button.active{color:var(--mint)}.list{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0e0d12}.row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;color:white;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px;min-height:68px}.row:last-child{border-bottom:0}.rowico{width:40px;height:40px}.rowcopy{flex:1;min-width:0}.rowcopy strong,.rowcopy span{display:block}.rowcopy strong{font-size:13px}.rowcopy span{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}.chev{font-size:22px;color:#81798c}.notice{padding:13px 14px;border-radius:14px;background:#21182c;border:1px solid #392650;color:#e0d5f1;line-height:1.5;margin:13px 0}.notice.mintnote{background:#10271d;border-color:#1d4b34;color:#c8f9dc}.notice.error{background:#2a1519;border-color:#53262d;color:#ffc5ca}.field{margin:14px 0}.field label{display:block;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:#aaa3b5;font-weight:800;margin-bottom:8px}.field input,.field textarea{width:100%;background:#08070b;border:1px solid #302b37;border-radius:12px;padding:13px;color:white}.field textarea{min-height:90px}.field small{display:block;color:var(--muted);margin-top:6px}.productgrid,.servicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--panel)}.product img,.product .placeholder{width:100%;aspect-ratio:1;object-fit:cover;background:#1a1720;display:grid;place-items:center;color:#887c98;font-size:32px}.pbody{padding:12px}.pbody strong{display:block;overflow-wrap:anywhere}.price{font:800 17px Manrope;color:var(--mint);margin-top:8px}.hero{border-radius:20px;padding:26px;background:radial-gradient(circle at 90% 10%,#b7f7d433,transparent 35%),linear-gradient(130deg,#21123d,#4c1d95 62%,#10271d);margin:17px 0}.hero small{color:var(--mint);font-weight:800;letter-spacing:1px;text-transform:uppercase}.hero h2{font:800 28px Manrope;margin:10px 0}.hero p{color:#e1d9eb;line-height:1.5}.service{border:1px solid var(--line);border-radius:18px;padding:16px;background:linear-gradient(145deg,#14111b,#0e0d11)}.service .emoji{font-size:25px}.service h3{font:700 16px Manrope;margin:10px 0 7px}.service p{color:var(--muted);line-height:1.5}.foot{text-align:center;color:#797283;font-size:11px;line-height:1.5;margin:24px 0}.toast{display:none;position:fixed;z-index:30;bottom:90px;left:16px;right:16px;padding:14px;border:1px solid #443653;border-radius:14px;background:#211c29;box-shadow:0 14px 45px #0008}.toast.show{display:block}
@media(min-width:700px){.content{padding:28px}.grid{grid-template-columns:repeat(4,1fr)}.productgrid{grid-template-columns:repeat(3,1fr)}.servicegrid{grid-template-columns:repeat(2,1fr)}.nav{width:min(680px,100%);left:50%;right:auto;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}.hero h2{font-size:35px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">N</div><div><div class="eyebrow" id="greeting">Your marketplace ✦</div><div class="brandname">NookStore</div></div></div><div class="icons"><button class="iconbtn" id="refresh" aria-label="Refresh">↻</button><button class="iconbtn" id="accountBtn" aria-label="Account">♙</button></div></header>
<main id="main" class="content"></main>
<nav class="nav"><button class="active" data-page="home"><span>▦</span>Home</button><button data-page="orders"><span>▢</span>Orders</button><button data-page="products"><span>⬡</span>Products</button><button data-page="account"><span>▱</span>Account</button><button data-page="more"><span>☰</span>More</button></nav><div class="toast" id="toast"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const URL='https://xebeiudhzeilasuveftf.supabase.co',KEY='sb_publishable_2gn07sGj2rCvrPazXz1Lqw_N2EkycBg';
const db=window.supabase?.createClient?window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48);
const money=n=>new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:2}).format(Number(n)||0);
let user=null,store=null,mine=[],stores=[],products=[],page='home',range='7 Days';
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3500)}
function title(t,s=''){return `<h1 class="title">${t}</h1>${s?`<p class="sub">${s}</p>`:''}`}
function empty(i,t,d,btn=''){return `<div class="empty"><div class="big">${i}</div><strong>${t}</strong>${d}${btn?`<div style="margin-top:16px">${btn}</div>`:''}</div>`}
function stat(i,v,l){return `<div class="stat"><div class="stat-ico">${i}</div><div class="value">${v}</div><div class="statlabel">${l}</div></div>`}
function row(i,t,d,a){return `<button class="row" data-action="${a}"><span class="rowico">${i}</span><span class="rowcopy"><strong>${t}</strong><span>${d}</span></span><span class="chev">›</span></button>`}
async function load(){if(!db)return;let r=await db.auth.getSession();user=r.data.session?.user||null;store=null;mine=[];
if(user){let s=await db.from('stores').select('*').eq('owner_id',user.id).order('created_at',{ascending:false}).limit(1);store=s.data?.[0]||null;if(store){let p=await db.from('products').select('*').eq('store_id',store.id).order('created_at',{ascending:false});mine=p.data||[]}}
let [ss,pp]=await Promise.all([db.from('stores').select('id,name,slug,description').order('created_at',{ascending:false}).limit(60),db.from('products').select('id,store_id,name,description,price,image_url,stock').order('created_at',{ascending:false}).limit(80)]);stores=ss.data||[];products=pp.data||[];$('#greeting').textContent=user?'Good day ✦':'Your marketplace ✦';$('#accountBtn').textContent=user?'♙':'↗'}
function prod(p,sname='NookStore seller'){return `<article class="product">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" onerror="this.style.display='none'">`:`<div class="placeholder">⬡</div>`}<div class="pbody"><strong>${esc(p.name)}</strong><div class="muted" style="font-size:11px;margin-top:5px">${esc(sname)} · ${Number(p.stock)||0} in stock</div><div class="price">${money(p.price)}</div>${p.description?`<p class="muted">${esc(p.description).slice(0,100)}</p>`:''}</div></article>`}
function signprompt(){return `<div class="notice">Sign in or create a free seller account to set up a store and manage products. You can browse public listings without signing in.</div><button class="btn" data-action="auth">Sign In / Create Account</button>`}
function home(){return `${store?`<div class="storelink"><div class="storeico">⌂</div><div class="storemeta"><strong>${esc(store.name)}</strong><span>nookstore /${esc(store.slug)}</span></div><span class="pill">● Store ready</span></div>`:''}${title('Home',user?'Welcome back to your seller dashboard.':'Discover products and independent sellers.')}${!user?signprompt():!store?`<div class="banner"><div class="spark">✦</div><div style="flex:1"><strong>Open your free store</strong><p>Set up your store and add your first product.</p></div><button class="btn mint" data-action="create-store">Start</button></div>`:''}<div class="ranges">${['Today','7 Days','30 Days','90 Days'].map(x=>`<button class="chip ${x===range?'active':''}" data-range="${x}">${x}</button>`).join('')}</div><div class="grid">${stat('↗',money(0),'Revenue')}${stat('▢','0','Orders')}${stat('⬡',mine.length,'Your products')}${stat('♧','0','Customers')}</div><div class="banner"><div class="spark">✧</div><div style="flex:1"><strong>Grow with NookSignal</strong><p>Websites, visibility and marketing support.</p></div><button class="btn mint" data-page="growth">Explore</button></div><div class="headrow"><h3>Quick Actions</h3></div><div class="quickgrid"><button class="quick" data-action="add"><span class="qico">＋</span><strong>Add Product</strong></button><button class="quick" data-page="orders"><span class="qico">▢</span><strong>View Orders</strong></button><button class="quick" data-action="settings"><span class="qico">⚙</span><strong>Store Settings</strong></button><button class="quick" data-action="online"><span class="qico">⌂</span><strong>View Store</strong></button></div><div class="headrow"><h3>Your Products</h3><button class="textbtn" data-page="products">See all</button></div>${mine.length?`<div class="productgrid">${mine.slice(0,4).map(p=>prod(p,store?.name)).join('')}</div>`:empty('⬡','No products yet','Add a product once your store is ready.',user&&store?'<button class="btn" data-action="add">Add Product</button>':'')}<div class="headrow"><h3>Explore marketplace</h3><button class="textbtn" data-page="products">Browse</button></div>${products.length?`<div class="productgrid">${products.slice(0,4).map(p=>prod(p,stores.find(s=>s.id===p.store_id)?.name||'NookStore seller')).join('')}</div>`:empty('✧','Marketplace ready to grow','Products from sellers will appear here.') }<div class="headrow"><h3>Recent Orders</h3></div>${empty('▢','No orders yet','Checkout and order management are planned for a later stage.')}<p class="foot">NookStore · A home for independent businesses.</p>`}
function orders(){return `${title('Orders','Manage customer orders in one place.') }<div class="tabs"><button class="chip active">All Orders</button><button class="chip">Pending</button><button class="chip">Completed</button></div>${empty('▢','No orders yet','Orders will appear here after checkout is implemented.')}<div class="notice">Checkout, order records, notifications and seller fulfilment need a separate backend stage.</div>`}
function productspage(){return `${title('Products','Manage your catalogue and browse the marketplace.')}<button class="btn" data-action="add">＋ Add Product</button><div class="headrow"><h3>Your products (${mine.length})</h3></div>${!user?signprompt():!store?empty('⌂','Set up your store first','Products need a seller store.','<button class="btn" data-action="create-store">Create Store</button>'):mine.length?`<div class="productgrid">${mine.map(p=>prod(p,store.name)).join('')}</div>`:empty('⬡','No products yet','Add your first product.','<button class="btn" data-action="add">Add Product</button>')}<div class="headrow"><h3>Marketplace products (${products.length})</h3></div>${products.length?`<div class="productgrid">${products.map(p=>prod(p,stores.find(s=>s.id===p.store_id)?.name||'NookStore seller')).join('')}</div>`:empty('✧','No listings yet','Seller products will show here.')}`}
function account(){return `${title('Account','Manage your seller access and account.') }<div class="card" style="background:linear-gradient(120deg,#4c1d95,#25133d 70%,#153b2b)"><div class="muted">NOOKSTORE SELLER ACCOUNT</div><h2 style="font:800 24px Manrope">${user?esc(user.email):'Welcome to NookStore'}</h2><p>${store?'Store: '+esc(store.name):'Free seller plan · Start by creating a store'}</p>${user?'<button class="btn mint" data-action="signout">Sign Out</button>':'<button class="btn mint" data-action="auth">Sign In / Register</button>'}</div><div class="list" style="margin-top:15px">${row('♙','Profile & access',user?'Signed in securely':'Sign in to manage your store','auth')}${row('⌂','Store settings','Name, description and link','settings')}${row('✦','Business Growth Hub','Optional NookSignal services','growth')}</div><div class="notice mintnote">NookStore does not currently hold seller funds. Wallet and withdrawals require a verified payment provider.</div>`}
function more(){return `${title('More','Store tools, customisation and support.')}<div class="label">Sales channels</div><div class="list">${row('⌂','Online Store','Storefront status, products and link','online')}${row('⌯','Share Store Link','Copy your store URL','share')}</div><div class="label">Manage</div><div class="list">${row('✧','Business Growth Hub','NookSignal website and marketing services','growth')}${row('⬡','Inventory','Products and stock levels','products')}${row('◇','Discounts','Promotions and sales — coming soon','discounts')}${row('▥','Analytics','Store performance overview','analytics')}</div><div class="label">Store settings</div><div class="list">${row('☷','Store Settings','Store name, description and link','settings')}${row('◈','Appearance','Royal Iris and Mint Frost theme','appearance')}${row('▰','Shipping & Delivery','Configuration — coming soon','shipping')}${row('🛒','Checkout & Payments','Payment provider integration','payments')}${row('▧','Storefront Content','Hero slides, trust badges, sections and policies','content')}${row('▧','Template Images','Hero and campaign images','images')}${row('✧','Premium Templates','Future storefront themes','premium')}</div><div class="label">Help & account</div><div class="list">${row('?','Help & Training','Seller setup guides','help')}${row('♙','Account & Sign Out','Manage your access','account')}</div><p class="foot">Items marked coming soon are placeholders, not active integrations.</p>`}
function createStore(){return `${title('Set up your store','Create your free seller storefront.')}<form id="storeForm" class="form"><div class="field"><label>Store name</label><input name="name" id="sname" required maxlength="70" placeholder="e.g. Nook Fashion"></div><div class="field"><label>Store URL slug</label><input name="slug" id="sslug" required maxlength="48" pattern="[a-z0-9-]+" placeholder="nook-fashion"><small>Lowercase letters, numbers and hyphens. Must be unique.</small></div><div class="field"><label>Description</label><textarea name="description" maxlength="500" placeholder="What do you sell?"></textarea></div><button class="btn full">Create My Store</button><div id="message"></div></form>`}
function addProduct(){return `${title('Add Product','Add a listing to your store catalogue.')}<form id="productForm" class="form"><div class="field"><label>Product name</label><input name="name" required maxlength="100"></div><div class="field"><label>Price (NGN ₦)</label><input name="price" type="number" min="0" step=".01" required placeholder="15000"></div><div class="field"><label>Stock quantity</label><input name="stock" type="number" min="0" step="1" value="1" required></div><div class="field"><label>Product image URL (optional)</label><input name="image_url" type="url" placeholder="https://example.com/image.jpg"><small>Direct public image URL only; file uploads will be added later.</small></div><div class="field"><label>Description</label><textarea name="description" maxlength="1000"></textarea></div><button class="btn full">Save Product</button><div id="message"></div></form>`}
function auth(){return `${title('Welcome to NookStore','Sign in or create a free seller account.')}<div class="form"><div class="tabs"><button type="button" class="chip active" data-tab="signin">Sign In</button><button type="button" class="chip" data-tab="signup">Create Account</button></div><form id="authForm"><input type="hidden" name="mode" id="mode" value="signin"><div class="field"><label>Email</label><input type="email" name="email" autocomplete="email" required></div><div class="field"><label>Password</label><input type="password" name="password" minlength="6" required autocomplete="current-password"></div><button class="btn full" id="authSubmit">Sign In</button><div id="message"></div></form></div><div class="notice">If email confirmation is enabled in Supabase, confirm your email before signing in.</div>`}
function settings(){return `${title('Store Settings','Update your storefront details.')} ${!user?signprompt():!store?`<button class="btn" data-action="create-store">Create Store</button>`:`<form id="settingsForm" class="form"><div class="field"><label>Store name</label><input name="name" required value="${esc(store.name)}"></div><div class="field"><label>Store slug</label><input name="slug" required pattern="[a-z0-9-]+" value="${esc(store.slug)}"></div><div class="field"><label>Description</label><textarea name="description">${esc(store.description||'')}</textarea></div><button class="btn full">Save Changes</button><div id="message"></div></form>`}`}
function online(){return `${title('Online Store','Manage your storefront and content.')}<div class="storelink"><div class="storeico">⌂</div><div class="storemeta"><strong>${esc(store?.name||'Your Store')}</strong><span>${store?'nookstore /'+esc(store.slug):'Create a store to get your link'}</span></div><span class="pill">● Ready</span></div><div class="label">Store controls</div><div class="grid"><div class="card"><div class="stat-ico">◉</div><strong>Store Status</strong><p class="muted">Listing visibility</p><span class="pill">Active</span></div><div class="card"><div class="stat-ico">⚒</div><strong>Maintenance</strong><p class="muted">Advanced controls</p><span class="muted">Coming soon</span></div></div><div class="label">Customise</div><div class="list">${row('◉','Storefront Content','Hero slides, trust badges and policies','content')}${row('☷','Store Settings','Store name, description and link','settings')}${row('▧','Template Images','Hero and campaign images','images')}</div><div class="hero"><small>Your storefront</small><h2>${esc(store?.name||'A store of your own')}</h2><p>${esc(store?.description||'Showcase your products with a polished NookStore storefront.')}</p></div>${mine.length?`<div class="productgrid">${mine.map(p=>prod(p,store?.name)).join('')}</div>`:empty('⬡','No products yet','Add products to start building your storefront.','<button class="btn" data-action="add">Add Product</button>')}`}
function content(){return `${title('Storefront Content','Trust badges, hero slides, sections and policies.')}<div class="tabs"><button class="chip active">Trust Badges</button><button class="chip">Hero Slides</button><button class="chip">Sections</button><button class="chip">Policies</button></div><div class="notice">Content editor preview. Saving this content permanently requires a storefront settings table in Supabase.</div>${[['🚚','Free Delivery','Delivery details depend on each seller'],['🔒','Secure Payment','Payment integration pending'],['↩','Easy Returns','Set a clear returns policy'],['★','Quality Products','Describe your product standards']].map(x=>`<div class="form" style="margin-bottom:13px"><div style="font-size:22px">${x[0]}</div><div class="field"><label>Title</label><input value="${x[1]}"></div><div class="field"><label>Description</label><input value="${x[2]}"></div></div>`).join('')}<button class="btn full" data-action="preview-save">Save Preview (not connected)</button>`}
function images(){return `${title('Template Images','Preview a banner image for your storefront.')}<div class="hero"><small>NookStore Collection</small><h2>Make your products stand out.</h2><p>Use clear product photos and wide campaign banners.</p></div><form id="imageForm" class="form"><div class="field"><label>Hero image URL</label><input type="url" name="url" placeholder="https://example.com/banner.jpg"></div><button class="btn full">Preview Image</button><div id="imagePreview"></div></form><div class="notice">Permanent uploads require Supabase Storage and access policies. This is a preview only.</div>`}
function growth(){return `${title('Business Growth Hub','Optional business growth services by NookSignal.')}<div class="hero"><small>NookSignal · Seller Growth</small><h2>Build trust. Reach more customers.</h2><p>Digital services for businesses that want a stronger online presence.</p></div><div class="notice mintnote">NookSignal promotions are clearly labelled and optional. You can use NookStore without purchasing any services.</div><div class="servicegrid">${[['✦','Website Design','A professional website or landing page.'],['⌖','Google Business Profile','Help local customers find your business.'],['◎','Social Media Marketing','Plan content and strengthen your social presence.'],['↗','SEO & Visibility','Improve website structure and discoverability.'],['★','Reviews & Reputation','Build a respectful process for genuine feedback.'],['◉','Advertising Support','Plan and improve advertising campaigns.']].map(x=>`<article class="service"><div class="emoji">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="btn secondary" data-contact="${x[1]}">Ask about service</button></article>`).join('')}</div><p class="foot">Enquiries open an email draft; no service is purchased automatically.</p>`}
function simple(t,d){return `${title(t,d)}<div class="notice">${d} This is a planned feature and is not yet connected to a live service.</div><button class="btn secondary" data-page="more">Back to More</button>`}
function render(){const views={home,orders,products:productspage,account,more,auth, 'create-store':createStore,'add-product':addProduct,settings,online,content,images,growth,premium:()=>simple('Premium Templates','Premium storefront themes and extra seller tools are planned.'),appearance:()=>simple('Appearance','The theme uses Royal Iris #4C1D95 and Mint Frost #B7F7D4.'),analytics:()=>simple('Analytics','Sales and visitor analytics need order tracking.'),shipping:()=>simple('Shipping & Delivery','Shipping options and delivery zones are planned.'),payments:()=>simple('Checkout & Payments','A payment provider must be integrated before accepting online payments.'),discounts:()=>simple('Discounts','Discount codes and promotions are planned.'),help:()=>simple('Help & Training','Seller guides will be added as the platform grows.')};main.innerHTML=(views[page]||home)();$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
async function needUser(){if(!user){toast('Please sign in first.');page='auth';render();return false}return true}
document.addEventListener('click',async e=>{
 let n=e.target.closest('[data-page]');if(n){page=n.dataset.page;render();return}
 let rg=e.target.closest('[data-range]');if(rg){range=rg.dataset.range;render();return}
 let tab=e.target.closest('[data-tab]');if(tab){$('#mode').value=tab.dataset.tab;$$('[data-tab]').forEach(b=>b.classList.toggle('active',b===tab));$('#authSubmit').textContent=tab.dataset.tab==='signup'?'Create Account':'Sign In';return}
 let c=e.target.closest('[data-contact]');if(c){location.href='mailto:hello@nooksignal.com?subject='+encodeURIComponent('NookSignal enquiry: '+c.dataset.contact);return}
 let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;
 if(a==='auth'){page='auth';render()}else if(a==='create-store'){if(await needUser()){page='create-store';render()}}else if(a==='add'){if(await needUser()){page=store?'add-product':'create-store';render();if(!store)toast('Create your store first.')}}else if(a==='settings'){if(await needUser()){page='settings';render()}}else if(a==='online'){page='online';render()}else if(a==='growth'){page='growth';render()}else if(a==='signout'){await db.auth.signOut();await load();page='home';render();toast('Signed out.')}else if(a==='share'){if(!store){toast('Create a store first.');return}let link=location.origin+location.pathname+'?store='+encodeURIComponent(store.slug);try{await navigator.clipboard.writeText(link);toast('Store link copied.')}catch{prompt('Copy your store link',link)}}else if(a==='preview-save'){toast('Preview only; this is not saved to the database.')}
});
document.addEventListener('submit',async e=>{
 e.preventDefault();let f=e.target;
 if(f.id==='authForm'){let d=new FormData(f),email=String(d.get('email')).trim(),password=String(d.get('password')),mode=d.get('mode');try{let r=mode==='signup'?await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(mode==='signup'&&!r.data.session){$('#message').innerHTML='<div class="notice mintnote">Account created. Check your email for a confirmation link, then return and sign in.</div>';return}await load();page=store?'home':'create-store';render();toast(mode==='signup'?'Account created.':'Welcome back.')}catch(err){$('#message').innerHTML=`<div class="notice error">${esc(err.message||'Authentication failed.')}</div>`}}
 if(f.id==='storeForm'){if(!await needUser())return;let d=new FormData(f),name=String(d.get('name')).trim(),sl=slug(d.get('slug')||name),description=String(d.get('description')||'').trim();try{let r=await db.from('stores').insert({owner_id:user.id,name,slug:sl,description}).select().single();if(r.error)throw r.error;await load();page='home';render();toast('Your store has been created.')}catch(err){$('#message').innerHTML=`<div class="notice error">${esc(err.message||'Could not create store. Check the table and security policies.')}</div>`}}
 if(f.id==='productForm'){if(!await needUser())return;if(!store){toast('Create a store first.');return}let d=new FormData(f),name=String(d.get('name')).trim(),price=Number(d.get('price')),stock=Number(d.get('stock'));if(!name||!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0){toast('Check product name, price and stock.');return}try{let r=await db.from('products').insert({store_id:store.id,name,price,stock,description:String(d.get('description')||'').trim(),image_url:String(d.get('image_url')||'').trim()||null}).select().single();if(r.error)throw r.error;await load();page='products';render();toast('Product added.')}catch(err){$('#message').innerHTML=`<div class="notice error">${esc(err.message||'Could not save product. Check your policies.')}</div>`}}
 if(f.id==='settingsForm'){let d=new FormData(f);try{let r=await db.from('stores').update({name:String(d.get('name')).trim(),slug:slug(d.get('slug')),description:String(d.get('description')||'').trim()}).eq('id',store.id).select().single();if(r.error)throw r.error;await load();page='online';render();toast('Store settings saved.')}catch(err){$('#message').innerHTML=`<div class="notice error">${esc(err.message||'Could not update settings.')}</div>`}}
 if(f.id==='imageForm'){let url=String(new FormData(f).get('url')||'').trim();$('#imagePreview').innerHTML=url?`<div style="margin-top:14px;border-radius:14px;overflow:hidden"><img src="${esc(url)}" alt="Banner preview" style="width:100%;max-height:260px;object-fit:cover"></div><p class="muted">Preview only; not saved.</p>`:''}
});
$('#refresh').addEventListener('click',async()=>{await load();render();toast('Refreshed.')});$('#accountBtn').addEventListener('click',()=>{page=user?'account':'auth';render()});
(async()=>{if(!db){main.innerHTML=title('NookStore','A marketplace for independent sellers.')+'<div class="notice error">Supabase library could not load. Check your connection and reload.</div>';return}try{await load()}catch(e){console.warn(e)}let q=new URLSearchParams(location.search).get('store');if(q&&stores.some(s=>s.slug===q))page='online';render();db.auth.onAuthStateChange(()=>setTimeout(async()=>{try{await load();render()}catch(e){console.warn(e)}},0))})();
})();
</script></body></html>
